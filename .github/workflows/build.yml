name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build portable executable
        run: pyinstaller cq_tdm.spec

      - name: Smoke test portable executable
        run: |
          dist\CQ_TDM.exe --version
          dist\CQ_TDM.exe --check-deps

      - name: Rename portable executable
        run: ren dist\CQ_TDM.exe CQ_TDM_Portable_Windows.exe

      - name: Build installer folder
        run: pyinstaller installers/cq_tdm_installer.spec

      - name: Smoke test installer executable
        run: |
          dist\CQ_TDM_installer\CQ_TDM.exe --version
          dist\CQ_TDM_installer\CQ_TDM.exe --check-deps

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        run: iscc installers/cq-tdm.iss

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: CQ_TDM_Portable_Windows
          path: dist/CQ_TDM_Portable_Windows.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CQ_TDM_Setup_Windows
          path: installers/Output/CQ_TDM_Setup_Windows.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CQ_TDM_Portable_Windows.exe
            installers/Output/CQ_TDM_Setup_Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
