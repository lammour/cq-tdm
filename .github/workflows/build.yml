name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

jobs:
  build-linux:
    if: ${{ github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Build executable
        run: pyinstaller cq_tdm.spec

      - name: Rename executable
        run: mv dist/CQ_TDM dist/CQ_TDM_Portable_Linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CQ_TDM_Portable_Linux
          path: dist/CQ_TDM_Portable_Linux

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CQ_TDM_Portable_Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    if: ${{ github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build portable executable
        run: pyinstaller cq_tdm.spec

      - name: Rename portable executable
        run: ren dist\CQ_TDM.exe CQ_TDM_Portable_Windows.exe

      - name: Build installer folder
        run: pyinstaller installers/cq_tdm_installer.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        run: iscc installers/cq-tdm.iss

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: CQ_TDM_Portable_Windows
          path: dist/CQ_TDM_Portable_Windows.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CQ_TDM_Setup_Windows
          path: installers/Output/CQ_TDM_Setup_Windows.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CQ_TDM_Portable_Windows.exe
            installers/Output/CQ_TDM_Setup_Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
