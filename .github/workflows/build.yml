name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos-arm
          - macos-intel

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: CQ_TDM
            asset_name: CQ_TDM-linux-x86_64
            platform_key: linux
          - os: windows-latest
            artifact_name: CQ_TDM.exe
            asset_name: CQ_TDM-windows-x86_64.exe
            platform_key: windows
          - os: macos-latest
            artifact_name: CQ_TDM
            asset_name: CQ_TDM-macos-arm64
            platform_key: macos-arm
          - os: macos-15-intel
            artifact_name: CQ_TDM
            asset_name: CQ_TDM-macos-x86_64
            platform_key: macos-intel

    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'release' || inputs.platform == 'all' || inputs.platform == matrix.platform_key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Build executable
        run: pyinstaller cq_tdm.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
