name: NPS Validation

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate-nps:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the figures branch
      pull-requests: write   # open the PR that updates docs/

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main  # Figures always reflect the current main branch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest matplotlib

      - name: Download ANSM test data
        run: |
          # Download test data from the 'test-data' release
          curl -L -o test_data.zip \
            "https://github.com/${{ github.repository }}/releases/download/test-data/ansm-test-data.zip"
          unzip -q test_data.zip -d .
          ls -la test_data/

      - name: Run NPS validation tests
        run: |
          mkdir -p tests/output
          pytest tests/test_nps_validation.py::TestCombinedValidation -v

      - name: Upload validation figures
        uses: actions/upload-artifact@v7
        with:
          name: nps-validation-figures
          path: |
            tests/output/nps_validation_combined.png
            tests/output/nps_roi_positions_combined.png

      # The README embeds docs/*.png. Committing straight to main used to collide
      # with the developer's own pushes, so the update is proposed as a pull
      # request instead; nothing is opened when the figures are unchanged.
      - name: Copy figures into docs/
        run: |
          cp tests/output/nps_validation_combined.png docs/
          cp tests/output/nps_roi_positions_combined.png docs/

      - name: Open pull request with updated figures
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/nps-validation-figures
          delete-branch: true
          add-paths: docs/nps_validation_combined.png,docs/nps_roi_positions_combined.png
          commit-message: Update NPS validation figures
          title: Update NPS validation figures
          body: |
            NPS validation figures regenerated by the NPS Validation workflow
            (run ${{ github.run_id }}, triggered by `${{ github.event_name }}`).
            Merge to refresh the figures shown in the README.
