name: NPS Validation

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate-nps:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push updated figures

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # Always update main branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest matplotlib

      - name: Download ANSM test data
        run: |
          # Download test data from the 'test-data' release
          curl -L -o test_data.zip \
            "https://github.com/${{ github.repository }}/releases/download/test-data/ansm-test-data.zip"
          unzip -q test_data.zip -d .
          ls -la test_data/

      - name: Run NPS validation tests
        run: |
          mkdir -p tests/output
          pytest tests/test_nps_validation.py::TestCombinedValidation -v

      - name: Update figures in docs
        run: |
          cp tests/output/nps_validation_combined.png docs/
          cp tests/output/nps_roi_positions_combined.png docs/

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet docs/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated figures
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/nps_validation_combined.png docs/nps_roi_positions_combined.png
          git commit -m "Update NPS validation figures

          Automatically generated by NPS validation workflow.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin main
