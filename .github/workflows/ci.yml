name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Only the rules that catch real defects (syntax errors, undefined names,
      # unused imports and variables). The style rules selected in pyproject.toml
      # (line length, naming, import order) are not met by the code base yet.
      - name: Lint
        run: ruff check src tests --select E9,F

      # The ANSM reference series are not in the repository: the tests that
      # need them are skipped here and run by the NPS validation workflow.
      - name: Run tests
        run: pytest -q
