[project]
name = "cq-tdm"
dynamic = ["version"]
description = "Contrôle de qualité interne des tomodensitomètres (décision ANSM du 18/12/2025)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CeCILL-2.1"}
authors = [
    {name = "Luis"}
]

# Upper bounds on the next major versions: an incompatible release must not
# reach users through "pip install cq-tdm" before it has been tested here
dependencies = [
    "pydicom>=2.4.0,<4",
    "numpy>=1.24.0,<3",
    "scipy>=1.11.0,<2",
    "PySide6-Essentials>=6.6.0,<7",
    "reportlab>=4.0.0,<6",
    "matplotlib>=3.8.0,<4",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
]

[project.scripts]
cq-tdm = "cq_tdm.main:main"

[project.gui-scripts]
cq-tdm-gui = "cq_tdm.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "cq_tdm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cq_tdm = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# Re-exports of the package's public names
"src/cq_tdm/core/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
